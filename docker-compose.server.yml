# Docker keeps container logs without a size limit by default, and the
# testrunner logs all the output of every test, so the disk fills up over
# time. Keep at most 3 files of 10 MB for each container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sitespeed.io-server:
    logging: *logging
    image: sitespeedio/server:${SITESPEED_IO_SERVER_VERSION}
    env_file:
      - .env
    environment:
      redis_host: ${REDIS_HOST}
      postgresql_server: ${POSTGRESQL_HOST}
      validTestDomains: ${VALID_TEST_DOMAINS}
    ports:
      - "3000:3000"
    restart: always
    networks:
      - skynet
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: [
              "CMD-SHELL",
              "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
            ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s