services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - skynet
    depends_on:
      sitespeed.io-server:
        condition: service_healthy
  redis:
    image: redis:${REDIS_DOCKER_VERSION}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: always
    networks:
      - skynet
    volumes:
      - redis_data:/data
      - ../redis-conf:/usr/local/etc/redis/
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  postgresql:
    image: postgres:${POSTGRESQL_DOCKER_VERSION}
    restart: always
    networks:
      - skynet
    environment:
      - POSTGRES_USER=${POSTGRESQL_USER}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRES_DB=${POSTGRESQL_DB}
    volumes:
      - ../server/database/setup/:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_DOCKER_VERSION}
    restart: always
    volumes:
      - seaweedfs-data:/data
    # The image entrypoint adds -dir=/data and -volume.max=0 and runs weed as
    # the unprivileged seaweed user. The admin S3 credentials come from the
    # AWS_* environment variables. The mounted config file only adds the
    # anonymous identity that gives public read access to the result bucket
    # (what "mc anonymous set download" did on MinIO). The S3 API listens on
    # 9000, the same port MinIO used.
    #
    # SeaweedFS expires whole volumes, not single files. A volume is deleted
    # 30 days after the newest file in it was written. Small 1 GB volumes fill
    # fast, so results live close to the 30 day TTL. With the 30 GB default a
    # quiet server could keep results for months. The filer splits files larger
    # than 4 MB into chunks, so the volume size does not limit the file size.
    command: server -filer -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_PASSWORD}
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    networks:
      - skynet
    # The S3 port answers before the volume server has registered with the
    # master, and reads fail until it has. Wait for both.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/healthz && wget -q -O - http://127.0.0.1:9333/dir/status | grep -q '\"Max\":[1-9]'"]
      interval: 5s
      timeout: 3s
      retries: 30
  seaweedfs-init:
    image: chrislusf/seaweedfs:${SEAWEEDFS_DOCKER_VERSION}
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      - skynet
    restart: on-failure
    # The 30 day expiry uses SeaweedFS native TTL (fs.configure) instead of an
    # S3 lifecycle rule, because lifecycle rules have a history of not being enforced.
    # The TTL counts from write time and only applies to files written after it
    # is set.
    entrypoint: >
      /bin/sh -c "
      (echo 's3.bucket.create -name sitespeedio' | weed shell -master=seaweedfs:9333 || echo 'Bucket already exists') &&
      echo 'fs.configure -locationPrefix=/buckets/sitespeedio/ -ttl=30d -apply' | weed shell -master=seaweedfs:9333 &&
      echo 'SeaweedFS bucket and TTL setup complete.'"
  sitespeed.io-server:
    image: sitespeedio/server:${SITESPEED_IO_SERVER_VERSION}
    env_file:
      - ../.env
    environment:
      redis_host: ${REDIS_HOST}
      postgresql_server: ${POSTGRESQL_HOST}
      validTestDomains: ${VALID_TEST_DOMAINS}
    restart: always
    networks:
      - skynet
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: [
              "CMD-SHELL",
              "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
            ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  sitespeed.io-testrunner:
    image: sitespeedio/testrunner:${SITESPEED_IO_TESTRUNNER_VERSION}
    env_file:
      - ../.env
    environment:
      redis_host: ${REDIS_HOST}
      location_name: ${LOCATION_NAME}
      docker_container: ${SITESPEED_IO_CONTAINER}
      docker_extraparameters: "--cap-add=NET_ADMIN --network=skynet"
      sitespeed.io_s3_endpoint: ${SITESPEED_IO_S3_ENDPOINT}
      sitespeed.io_s3_bucketname: 'sitespeedio'
      sitespeed.io_s3_key: ${MINIO_USER}
      sitespeed.io_s3_secret: ${MINIO_PASSWORD}
      sitespeed.io_s3_region: "motown"
      sitespeed.io_s3_options_forcePathStyle: true
      sitespeed.io_s3_removeLocalResult: true
      sitespeed.io_resultBaseURL: ${RESULT_BASE_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    cap_add:
      - NET_ADMIN
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      sitespeed.io-server:
        condition: service_healthy
    networks:
      - skynet
configs:
  seaweedfs-s3:
    content: |
      {"identities":[{"name":"anonymous","actions":["Read:sitespeedio"]}]}
volumes:
  postgres-data:
  seaweedfs-data:
  redis_data:
    driver: local
  caddy_data:
  caddy_config:
networks:
  skynet:
    name: skynet
