# Docker keeps container logs without a size limit by default, and the
# testrunner logs all the output of every test, so the disk fills up over
# time. Keep at most 3 files of 10 MB for each container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sitespeed.io-testrunner:
    logging: *logging
    image: sitespeedio/testrunner:${SITESPEED_IO_TESTRUNNER_VERSION}
    env_file:
      - ../.env
    environment:
      redis_host: ${REDIS_HOST}
      location_name: ${LOCATION_NAME}
      docker_container: ${SITESPEED_IO_CONTAINER}
      docker_extraparameters: "--cap-add=NET_ADMIN"
      sitespeed.io_s3_endpoint: ${SITESPEED_IO_S3_ENDPOINT}
      sitespeed.io_s3_bucketname: 'sitespeedio'
      sitespeed.io_s3_key: ${MINIO_USER}
      sitespeed.io_s3_secret: ${MINIO_PASSWORD}
      sitespeed.io_s3_region: "motown"
      sitespeed.io_s3_options_forcePathStyle: true
      sitespeed.io_s3_removeLocalResult: true
      sitespeed.io_resultBaseURL: ${RESULT_BASE_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    cap_add:
      - NET_ADMIN
    restart: always
    networks:
      - skynet
networks:
  skynet:
    name: skynet
