services:
  redis:
    image: redis:${REDIS_DOCKER_VERSION}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: always
    networks:
      - skynet
    volumes:
      - redis_data:/data
      - ./redis-conf:/usr/local/etc/redis/
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  postgresql:
    image: postgres:${POSTGRESQL_DOCKER_VERSION}
    restart: always
    networks:
      - skynet
    environment:
      - POSTGRES_USER=${POSTGRESQL_USER}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRES_DB=${POSTGRESQL_DB}
    volumes:
      - ./server/database/setup/:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_DOCKER_VERSION}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "9000:9000"
    # SeaweedFS reads S3 credentials from a config file, not env vars, so the
    # entrypoint writes it from .env values first. The anonymous identity gives
    # public read access to the result bucket (what "mc anonymous set download"
    # did on MinIO). The S3 API listens on 9000, the same port MinIO used.
    entrypoint: >
      /bin/sh -c "
      printf '%s' '{\"identities\":[{\"name\":\"admin\",\"credentials\":[{\"accessKey\":\"${MINIO_USER}\",\"secretKey\":\"${MINIO_PASSWORD}\"}],\"actions\":[\"Admin\",\"Read\",\"List\",\"Tagging\",\"Write\"]},{\"name\":\"anonymous\",\"actions\":[\"Read:sitespeedio\"]}]}' > /etc/seaweedfs-s3.json &&
      exec weed server -dir=/data -filer -s3 -s3.port=9000 -s3.config=/etc/seaweedfs-s3.json -volume.max=0 -master.volumeSizeLimitMB=1024"
    networks:
      - skynet
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
  seaweedfs-init:
    image: chrislusf/seaweedfs:${SEAWEEDFS_DOCKER_VERSION}
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      - skynet
    restart: on-failure
    # The 30 day expiry uses SeaweedFS native TTL (fs.configure) instead of an
    # S3 lifecycle rule — lifecycle rules have a history of not being enforced.
    # The TTL counts from write time and only applies to files written after it
    # is set.
    entrypoint: >
      /bin/sh -c "
      (echo 's3.bucket.create -name sitespeedio' | weed shell -master=seaweedfs:9333 || echo 'Bucket already exists') &&
      echo 'fs.configure -locationPrefix=/buckets/sitespeedio/ -ttl=30d -apply' | weed shell -master=seaweedfs:9333 &&
      echo 'SeaweedFS bucket and TTL setup complete.'"
volumes:
  postgres-data:
  seaweedfs-data:
  redis_data:
    driver: local
networks:
  skynet:
    name: skynet
